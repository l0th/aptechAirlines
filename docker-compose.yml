services:
  mongodb:
    image: mongo:7.0
    container_name: ars-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - ars-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - ars-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ars-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/airline_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AIRLABS_API_KEY: ${AIRLABS_API_KEY:-}
      MAX_ADVANCE_BOOKING_DAYS: ${MAX_ADVANCE_BOOKING_DAYS:-330}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Airline Reservation System <no-reply@airline.local>}
      PAYPAL_ENABLED: ${PAYPAL_ENABLED:-false}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_PRESENTMENT_CURRENCY: ${PAYPAL_PRESENTMENT_CURRENCY:-USD}
      PAYPAL_VND_PER_PRESENTMENT_UNIT: ${PAYPAL_VND_PER_PRESENTMENT_UNIT:-25000}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ars-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ars-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - ars-network

networks:
  ars-network:
    driver: bridge

volumes:
  ars-mongo-data:
    driver: local
