version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ars-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: airline_db
    volumes:
      - mongo-data:/data/db
    networks:
      - ars-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ars-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/airline_db
      JWT_SECRET: ars_jwt_super_secret_key_2026_secured
      SUPER_ADMIN_USERNAME: superadmin
      SUPER_ADMIN_PASSWORD: SuperAdmin@2026
      SUPER_ADMIN_EMAIL: superadmin@airline.com
      AIRLABS_API_KEY: ${AIRLABS_API_KEY:-}
    depends_on:
      - mongodb
    networks:
      - ars-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ars-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - ars-network

networks:
  ars-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
