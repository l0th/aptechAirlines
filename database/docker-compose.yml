# LEGACY ONLY: runtime chính dùng ../docker-compose.yml.
# Không dùng file này cho môi trường chạy thông thường vì bootstrap có thể chèn dữ liệu mẫu.
services:
  mongodb:
    image: mongo:7.0
    container_name: ars-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: airline_db
    volumes:
      - ars-mongo-data:/data/db
    networks:
      - ars-db-network

  bootstrap:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    environment:
      MONGO_URI: mongodb://mongodb:27017/airline_db
    depends_on:
      - mongodb
    stdin_open: true
    tty: true
    networks:
      - ars-db-network

networks:
  ars-db-network:
    driver: bridge

volumes:
  ars-mongo-data:
    driver: local
